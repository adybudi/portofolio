name: Deploy Portfolio to Shared Hosting

on:
  workflow_dispatch:
  push:
    branches: [production]

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, bcmath, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Prepare environment for tests
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run test suite
        env:
          APP_ENV: testing
        run: php artisan test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: "Deploy 1/5 - Update code"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            test -d .git
            test -f public/build/manifest.json
            echo "Before: $(git rev-parse --short HEAD)"
            git fetch origin production
            git checkout -B production origin/production
            git reset --hard origin/production
            echo "Now at: $(git rev-parse --short HEAD)"

      - name: "Deploy 2/5 - Composer & package discovery"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            # --no-scripts: shared hosting disables proc_open, which the default
            # post-autoload-dump script (`artisan package:discover`) needs.
            if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            elif [ -f composer.phar ]; then
              php composer.phar install --no-dev --optimize-autoloader --no-interaction --no-scripts
            fi
            if php artisan package:discover --ansi; then
              echo "Package discovery OK"
            else
              echo "WARN: package discovery failed (exit $?); continuing"
            fi

      - name: "Deploy 3/5 - Sync public assets"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PUBLIC_PATH: ${{ secrets.PUBLIC_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DEPLOY_PATH,PUBLIC_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            # Never delete public_html/uploads or other folders (Seal project lives there too).
            if [ -n "$PUBLIC_PATH" ]; then
              if [ -L "$PUBLIC_PATH/build" ]; then
                echo "public_html/build is a symlink; skipping build copy."
              else
                rm -rf "$PUBLIC_PATH/build"
                mkdir -p "$PUBLIC_PATH/build"
                cp -R public/build/. "$PUBLIC_PATH/build/"
                echo "build copied"
              fi

              if [ -L "$PUBLIC_PATH/uploads" ]; then
                echo "public_html/uploads is a symlink; skipping upload copy."
              else
                mkdir -p "$PUBLIC_PATH/uploads"
                cp -R public/uploads/. "$PUBLIC_PATH/uploads/"
                echo "uploads copied"
              fi
            else
              echo "PUBLIC_PATH is empty; skipping asset copy."
            fi

      - name: "Deploy 4/5 - Run migrations"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            php artisan migrate --force

      - name: "Deploy 5/5 - Rebuild caches"
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            php artisan optimize:clear || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true
            php artisan queue:restart || true
            echo "Deployment finished: $(date -u +%FT%TZ)"

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsSL "${{ secrets.SITE_URL }}/up"; then
              echo "Health check OK"
              exit 0
            fi
            sleep 5
          done

          echo "Health check failed"
          exit 1
